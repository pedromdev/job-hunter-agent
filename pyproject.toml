[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-hunter-tools"
version = "0.1.0"
description = "Custom Nanobot tools for job hunting"
requires-python = ">=3.11"
dependencies = [
    "jinja2",
    "playwright",
    "httpx",
    "beautifulsoup4",
    "lxml",
    "scikit-learn",
    "PyPDF2",
]

[project.entry-points."nanobot.tools"]
resume_generator = "job_hunter_tools.resume_generator:ResumeGeneratorTool"
resume_editor = "job_hunter_tools.resume_editor:ResumeEditorTool"
ats_validator = "job_hunter_tools.ats_validator:ATSValidatorTool"
ats_format_check = "job_hunter_tools.ats_format_checker:ATSFormatCheckerTool"
cover_letter = "job_hunter_tools.cover_letter:CoverLetterTool"
company_researcher = "job_hunter_tools.company_researcher:CompanyResearcherTool"
career_compass = "job_hunter_tools.career_compass:CareerCompassTool"
